services:
  postgres:
    image: postgres:16-alpine
    container_name: trustmark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustmark
      POSTGRES_USER: trustmark
      POSTGRES_PASSWORD: trustmark
    ports:
      - "5432:5432"
    volumes:
      - trustmark_pgdata:/var/lib/postgresql/data

volumes:
  trustmark_pgdata:

